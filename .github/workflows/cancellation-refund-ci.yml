name: Cancellation and Refund Safety
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/20261112*'
      - '.github/workflows/cancellation-refund-ci.yml'
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cancellation eligibility tests
        run: npx vitest run src/tests/cancellation_eligibility.test.ts
      - name: Frontend typecheck and build
        run: npm run build

  backend-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Dispatch guard tests
        run: deno test supabase/functions/_shared/cancellation-dispatch-guard.test.ts
      - name: Typecheck affected Supabase Edge Functions
        run: |
          deno check --node-modules-dir=auto --no-lock supabase/functions/refund-order/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/request-order-resolution/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/dac-create-shipment/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/distrilogic-create-shipment/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/shipping-worker/index.ts
  migration-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL syntax parser
        run: python -m pip install pglast
      - name: Validate migration grammar
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          files = sorted(Path('supabase/migrations').glob('20261112*.sql'))
          assert files, 'Migration files missing'
          for file in files:
              parse_sql(file.read_text())
              print('Validated', file)
          PY

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: collectibles_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d collectibles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only_password
      PGDATABASE: collectibles_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Create isolated schema and apply cancellation migrations
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/cancellation_postgres_fixture.sql
          for m in supabase/migrations/2026111200000*.sql; do
            echo "Applying $m"
            psql -X -v ON_ERROR_STOP=1 -f "$m"
          done
      - name: Validate financial transitions, idempotency, and dispatch guards
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/cancellation_postgres_assertions.sql
