name: Cancellation and Refund Safety
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'supabase/functions/refund-order/**'
      - 'supabase/functions/request-order-resolution/**'
      - 'supabase/migrations/20261112*'
      - '.github/workflows/cancellation-refund-ci.yml'
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cancellation eligibility tests
        run: npx vitest run src/tests/cancellation_eligibility.test.ts
      - name: Frontend typecheck and build
        run: npm run build
