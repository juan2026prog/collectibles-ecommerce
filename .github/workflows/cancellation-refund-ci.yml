name: Cancellation and Refund Safety
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/20261112*'
      - '.github/workflows/cancellation-refund-ci.yml'
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cancellation eligibility tests
        run: npx vitest run src/tests/cancellation_eligibility.test.ts
      - name: Frontend typecheck and build
        run: npm run build

  backend-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Dispatch guard tests
        run: deno test supabase/functions/_shared/cancellation-dispatch-guard.test.ts
  migration-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL syntax parser
        run: python -m pip install pglast
      - name: Validate migration grammar
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          files = sorted(Path('supabase/migrations').glob('20261112*.sql'))
          assert files, 'Migration files missing'
          for file in files:
              parse_sql(file.read_text())
              print('Validated', file)
          PY
