name: Customer Order Currency Regression
on:
  pull_request:
    paths:
      - 'frontend/src/pages/CustomerPortal.tsx'
      - 'frontend/src/components/customer/CustomerRequestsTab.tsx'
      - 'frontend/src/tests/order_source_currency.test.ts'
      - '.github/workflows/customer-order-currency.yml'
  workflow_dispatch:
jobs:
  order-currency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run src/tests/order_source_currency.test.ts
      - run: npm run build
