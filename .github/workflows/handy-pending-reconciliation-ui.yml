name: Handy pending reconciliation customer UX
on:
  pull_request:
    paths:
      - 'frontend/src/pages/CheckoutSuccess.tsx'
      - 'frontend/src/pages/CustomerPortal.tsx'
      - '.github/workflows/handy-pending-reconciliation-ui.yml'
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
