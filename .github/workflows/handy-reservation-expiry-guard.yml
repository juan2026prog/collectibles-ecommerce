name: Handy reconciliation stock-expiry regression
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261112223000_protect_handy_reconciliation_reservations.sql'
      - 'tests/integration/handy_reconciliation_expiry_*.sql'
      - '.github/workflows/handy-reservation-expiry-guard.yml'
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: collectibles_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d collectibles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only_password
      PGDATABASE: collectibles_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply minimal fixture and production-function guard
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/handy_reconciliation_expiry_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261112223000_protect_handy_reconciliation_reservations.sql
      - name: Exercise approved, review, and unpaid expiry
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/handy_reconciliation_expiry_assertions.sql
