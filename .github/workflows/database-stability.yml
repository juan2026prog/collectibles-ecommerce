name: Collectibles public stability

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: collectibles-public-stability
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Four sequential public probes with one retry per failure
        run: node scripts/monitor_database_stability.mjs monitoring-output/stability.json
      - name: Preserve sanitized sample even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stability-${{ github.run_id }}
          path: monitoring-output/stability.json
          retention-days: 14
          if-no-files-found: warn
